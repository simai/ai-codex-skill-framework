name: SIMAI Framework Skill Checks

on:
  push:
    paths:
      - "skills/framework/**"
      - ".github/workflows/framework-skill-checks.yml"
  pull_request:
    paths:
      - "skills/framework/**"
      - ".github/workflows/framework-skill-checks.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SIMAI Framework Local Checks
        run: |
          bash skills/framework/scripts/run_local_checks.sh
